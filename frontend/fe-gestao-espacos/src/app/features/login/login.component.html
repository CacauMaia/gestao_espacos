<main class="login-page" data-test="login-page">
  <section class="brand-panel" aria-labelledby="login-title">
    <img class="brand-logo" src="/assets/images/logoPuc.png" alt="PUCPR Grupo Marista" data-test="login-logo" />

    <div>
      <p class="eyebrow">{{ 'app.subtitle' | transloco }}</p>
      <h1 id="login-title">{{ 'login.title' | transloco }}</h1>
      <p class="description">{{ 'login.description' | transloco }}</p>
    </div>
  </section>

  <section class="form-panel" [attr.aria-label]="'login.formLabel' | transloco">
    <form [formGroup]="form" (ngSubmit)="submit()" data-test="login-form">
      <label>
        <span>{{ 'login.email' | transloco }}</span>
        <input formControlName="email" type="email" autocomplete="email" [placeholder]="'login.emailPlaceholder' | transloco" data-test="login-email-input" />
      </label>

      <label>
        <span>{{ 'login.password' | transloco }}</span>
        <input formControlName="password" type="password" autocomplete="current-password" [placeholder]="'login.passwordPlaceholder' | transloco" data-test="login-password-input" />
      </label>

      @if (errorKey(); as key) {
        <p class="error" role="alert">{{ key | transloco }}</p>
      }

      <button class="primary-action" type="submit" [disabled]="!canSubmit()" data-test="login-submit-button">
        <lucide-icon name="LogIn" size="18" />
        <span>{{ (isSubmitting() ? 'login.loading' : 'login.submit') | transloco }}</span>
      </button>
    </form>
  </section>
</main>
